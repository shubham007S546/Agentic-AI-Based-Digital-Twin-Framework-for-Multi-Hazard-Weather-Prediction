[tool.poetry]
name = "weather-twin-backend"
version = "1.0.0"
description = "Agentic AI-Based Digital Twin Framework for Rainfall Prediction and Extreme Weather Intelligence"
authors = ["Shubham <shubham@weather-twin.ai>"]
packages = [{ include = "app" }]
[tool.poetry.dependencies]
python = "^3.12"

# ── Web Framework ──────────────────────────────────────────────────────────────
fastapi = "^0.115.0"
uvicorn = { version = "^0.32.0", extras = ["standard"] }
python-multipart = "^0.0.12"

# ── Database (async SQLAlchemy 2.0 + PostgreSQL) ───────────────────────────────
sqlalchemy = { version = "^2.0.36", extras = ["asyncio"] }
alembic = "^1.14.0"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.9"

# ── Data Validation ────────────────────────────────────────────────────────────
pydantic = "^2.9.2"
pydantic-settings = "^2.6.1"
email-validator = "^2.2.0"

# ── Authentication & Security ──────────────────────────────────────────────────
python-jose = { version = "^3.3.0", extras = ["cryptography"] }
PyJWT = "^2.10.1"
passlib = { version = "^1.7.4", extras = ["bcrypt"] }
python-dotenv = "^1.0.1"

# ── Caching ────────────────────────────────────────────────────────────────────
redis = { version = "^5.2.0", extras = ["hiredis"] }

# ── Background Tasks ───────────────────────────────────────────────────────────
celery = { version = "^5.4.0", extras = ["redis"] }
celery-redbeat = "^2.2.0"

# ── HTTP Client ────────────────────────────────────────────────────────────────
httpx = "^0.27.2"
tenacity = "^9.0.0"
aiohttp = "^3.11.0"
langgraph = "^0.6.7"

# ── Object Storage ─────────────────────────────────────────────────────────────
boto3 = "^1.35.0"
minio = "^7.2.9"

# ── Observability ──────────────────────────────────────────────────────────────
opentelemetry-sdk = "^1.28.0"
opentelemetry-api = "^1.28.0"
opentelemetry-instrumentation-fastapi = "^0.49b0"
opentelemetry-instrumentation-sqlalchemy = "^0.49b0"
opentelemetry-instrumentation-redis = "^0.49b0"
opentelemetry-instrumentation-httpx = "^0.49b0"
opentelemetry-exporter-otlp-proto-grpc = "^1.28.0"
prometheus-fastapi-instrumentator = "^7.0.0"
prometheus-client = "^0.21.0"

# ── Logging ────────────────────────────────────────────────────────────────────
structlog = "^24.4.0"
python-json-logger = "^2.0.7"

# ── ML / Model Serving ─────────────────────────────────────────────────────────
numpy = "^2.1.0"
pandas = "^2.2.3"
scikit-learn = "^1.5.2"
xgboost = "^2.1.1"
lightgbm = "^4.5.0"
catboost = "^1.2.7"
onnxruntime = "^1.19.2"
torch = "^2.5.0"
onnx = "^1.17.0"
skl2onnx = "^1.17.0"
joblib = "^1.4.2"

# ── Geospatial ─────────────────────────────────────────────────────────────────
geopandas = "^1.0.1"
shapely = "^2.0.6"
pyproj = "^3.7.0"

# ── Data Processing ────────────────────────────────────────────────────────────
scipy = "^1.14.1"
netCDF4 = "^1.7.2"
h5py = "^3.12.1"

# ── Report Generation ──────────────────────────────────────────────────────────
jinja2 = "^3.1.4"
weasyprint = "^63.0"

# ── Email ──────────────────────────────────────────────────────────────────────
aiosmtplib = "^3.0.2"

# ── Utilities ──────────────────────────────────────────────────────────────────
python-dateutil = "^2.9.0"
pytz = "^2024.2"
orjson = "^3.10.11"
cryptography = "^43.0.3"
click = "^8.1.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.27.2"
factory-boy = "^3.3.1"
faker = "^30.8.2"
anyio = { version = "^4.6.2", extras = ["trio"] }

# ── Code Quality ───────────────────────────────────────────────────────────────
ruff = "^0.7.1"
mypy = "^1.13.0"
black = "^24.10.0"
isort = "^5.13.2"
bandit = "^1.8.0"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "ISC", "PIE", "T20", "RET", "SIM"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S", "ANN"]
"alembic/*" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "alembic/*", "tests/*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
